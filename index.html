    <script>
      (function() {
        // Intercept Vite HMR WebSocket connections to prevent 'WebSocket closed without opened' errors in cloud proxy
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          function MockViteWebSocket() {
            this.readyState = 1; // WebSocket.OPEN
            this.binaryType = 'blob';
            this.listeners = {};
          }
          MockViteWebSocket.prototype.addEventListener = function(event, handler) {
            if (!this.listeners[event]) this.listeners[event] = [];
            this.listeners[event].push(handler);
            if (event === 'open') {
              var self = this;
              setTimeout(function() {
                try { handler.call(self, { type: 'open' }); } catch (e) {}
              }, 0);
            }
          };
          MockViteWebSocket.prototype.removeEventListener = function(event, handler) {
            if (this.listeners[event]) {
              this.listeners[event] = this.listeners[event].filter(function(h) { return h !== handler; });
            }
          };
          MockViteWebSocket.prototype.dispatchEvent = function() { return true; };
          MockViteWebSocket.prototype.send = function() {};
          MockViteWebSocket.prototype.close = function() {
            this.readyState = 3;
          };

          var PatchedWebSocket = function(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isViteHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1)) {
              isViteHmr = true;
            }
            if (isViteHmr) {
              return new MockViteWebSocket();
            }
            return new RealWebSocket(url, protocols);
          };
          PatchedWebSocket.prototype = RealWebSocket.prototype;
          PatchedWebSocket.CONNECTING = 0;
          PatchedWebSocket.OPEN = 1;
          PatchedWebSocket.CLOSING = 2;
          PatchedWebSocket.CLOSED = 3;
          window.WebSocket = PatchedWebSocket;
        }

        var isIgnored = function(val) {
          if (!val) return false;
          var str = typeof val === 'string' ? val : (val.message || (val.toString ? val.toString() : ''));
          return str.indexOf('WebSocket closed without opened') !== -1 ||
                 str.indexOf('WebSocket connection to') !== -1 ||
                 str.indexOf('ECONNREFUSED') !== -1 ||
                 str.indexOf('Connection reset') !== -1 ||
                 str.indexOf('publickey-credentials-create') !== -1 ||
                 str.indexOf('Timeout starting video source') !== -1 ||
                 str.indexOf('Cannot transition to a new state') !== -1 ||
                 str.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
                 str.indexOf('@firebase/firestore') !== -1 ||
                 str.indexOf('client will operate in offline mode') !== -1 ||
                 str.indexOf("Backend didn't respond within 10 seconds") !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isIgnored(e.message) || isIgnored(e.error)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isIgnored(e.reason)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isIgnored(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isIgnored(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };
      })();
    </script>
